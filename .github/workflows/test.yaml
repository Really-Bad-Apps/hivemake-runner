name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r host-requirements.txt -r dev-requirements.txt
      - run: ruff check runner blueprints hivemake_runner.py tests
      - run: pytest
      - run: docker build -t hivemake-runner:test .

services:
  api:
    image: ${RUNNER_IMAGE:-hivemake-runner:local}
    build: .
    # Match the host runner's numeric UID/GID to access its owner-only socket.
    user: "${RUNNER_UID:?Set the host runner UID}:${RUNNER_GID:?Set the host runner GID}"
    restart: unless-stopped
    environment:
      PORT: "7183"
      RUNNER_SOCKET: /run/hivemake-runner/runner.sock
    volumes:
      - type: bind
        source: ${RUNNER_SOCKET_DIR:?Set the host socket directory}
        target: /run/hivemake-runner
        read_only: true
        bind:
          create_host_path: false
    # Bind only loopback by default. Set RUNNER_BIND_IP to a tailnet address
    # for tailnet access, or remove ports for Docker-network-only access.
    ports:
      - "${RUNNER_BIND_IP:-127.0.0.1}:${RUNNER_PORT:-7183}:7183"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

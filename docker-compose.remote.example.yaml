# Split-host deployment: this API connects to a runner on another tailnet host.
services:
  api:
    image: ${RUNNER_IMAGE:?Set the published image digest}
    restart: unless-stopped
    environment:
      PORT: "7183"
      RUNNER_URL: ${RUNNER_URL:?Set the host runner tailnet HTTP origin}
    ports:
      - "${RUNNER_BIND_IP:?Set this API host's tailnet address}:7183:7183"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

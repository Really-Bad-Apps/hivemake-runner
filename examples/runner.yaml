# Copy to runner.yaml (ignored by Git). Use absolute host paths throughout.
roots:
  - /srv/projects
socket: /run/hivemake-runner/runner.sock
state_dir: /var/lib/hivemake-runner
commands:
  codex: [/opt/hivemake-runner/adapters/node_modules/.bin/codex-acp]
  claude: [/opt/hivemake-runner/adapters/node_modules/.bin/claude-agent-acp]
# Install the shared Markdown once; any discovered project can reference this name.
instruction_profiles:
  ticket-read-only:
    file: /etc/hivemake-runner/instructions/ticket-read-only.md
discovery_interval: 60  # Seconds between completed scan and next automatic scan.
startup_timeout: 60
run_timeout: 1800
cancel_grace: 5
max_sessions: 32
# This host's Tailscale IPv4, reachable from HiveMake.
listen_host: 100.64.0.10
listen_port: 7184
hivemake_url: https://api.example.com
display_name: Development host
# Set HIVEMAKE_OWNER_API_KEY in the service environment, never in this YAML.

# Optional: existing native Codex server Unix socket. Enables explicit terminal
# attachments; the runner never starts or owns that server. Omit to disable.
# codex_socket: /run/user/1000/codex/app-server.sock
